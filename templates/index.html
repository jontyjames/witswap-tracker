<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witswap Marine Data Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #0a1628 0%, #0f2440 50%, #0a1628 100%);
            color: #e0e7ef;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.2em;
            font-weight: 300;
            color: #e0e7ef;
            letter-spacing: 1px;
        }

        h1 .accent {
            color: #00bcd4;
        }

        /* Controls bar */
        .controls {
            background: rgba(15, 30, 55, 0.85);
            border: 1px solid rgba(0, 188, 212, 0.15);
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: rgba(0, 188, 212, 0.15);
            color: #00bcd4;
            border: 1px solid rgba(0, 188, 212, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(0, 188, 212, 0.25);
            border-color: rgba(0, 188, 212, 0.5);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .status-text {
            color: #8899aa;
            font-size: 13px;
        }

        .status-text.success {
            color: #4caf50;
        }

        .status-text.error {
            color: #ef5350;
        }

        /* Auto-refresh indicator */
        .refresh-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #8899aa;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s ease-in-out infinite;
        }

        .pulse-dot.unhealthy {
            background: #ef5350;
            animation: none;
        }

        .pulse-dot.degraded {
            background: #ffb74d;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Current conditions */
        .current-data {
            background: rgba(15, 30, 55, 0.85);
            border: 1px solid rgba(0, 188, 212, 0.15);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .current-data h2 {
            color: #e0e7ef;
            font-weight: 300;
            margin-bottom: 16px;
            font-size: 1.3em;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .data-item {
            background: rgba(10, 22, 40, 0.6);
            padding: 14px;
            border-radius: 6px;
            border-left: 3px solid #00bcd4;
            position: relative;
        }

        .data-item.warning {
            border-left-color: #ffb74d;
        }

        .data-item.danger {
            border-left-color: #ef5350;
        }

        .data-item label {
            display: block;
            color: #8899aa;
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-item value {
            display: block;
            color: #e0e7ef;
            font-size: 20px;
            font-weight: 600;
        }

        .alert-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .alert-badge.warning {
            background: rgba(255, 183, 77, 0.2);
            color: #ffb74d;
            border: 1px solid rgba(255, 183, 77, 0.3);
        }

        .alert-badge.danger {
            background: rgba(239, 83, 80, 0.2);
            color: #ef5350;
            border: 1px solid rgba(239, 83, 80, 0.3);
        }

        /* Charts */
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .chart-container {
            background: rgba(15, 30, 55, 0.85);
            border: 1px solid rgba(0, 188, 212, 0.15);
            padding: 20px;
            border-radius: 10px;
        }

        .chart-container h3 {
            color: #e0e7ef;
            font-weight: 300;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            color: #8899aa;
            font-size: 14px;
            padding: 20px;
        }

        .trend {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .trend.rising {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.15);
        }

        .trend.falling {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.15);
        }

        .trend.stable {
            color: #8899aa;
            background: rgba(136, 153, 170, 0.1);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 1.6em;
                margin-bottom: 16px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .controls-left, .controls-right {
                justify-content: center;
                flex-wrap: wrap;
            }

            .charts {
                grid-template-columns: 1fr;
            }

            .data-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .data-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .data-item value {
                font-size: 16px;
            }

            .data-item label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Port of Napier <span class="accent">Marine Tracker</span></h1>

        <div class="controls">
            <div class="controls-left">
                <button class="btn" id="fetchBtn" onclick="manualFetch()">Fetch Now</button>
                <span class="status-text" id="status">Ready</span>
            </div>
            <div class="controls-right">
                <div class="refresh-indicator">
                    <div class="pulse-dot" id="healthDot"></div>
                    <span id="refreshCountdown">Auto-refresh 2:00</span>
                </div>
                <span class="status-text">Updated: <span id="lastUpdate">--</span></span>
            </div>
        </div>

        <div class="current-data">
            <h2>Current Conditions</h2>
            <div class="data-grid" id="currentData">
                <div class="loading">Loading current conditions...</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-container">
                <h3>Wind Speed (kn)</h3>
                <canvas id="windSpeedChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Wind Direction</h3>
                <canvas id="windDirectionChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Wave Height (m) <span id="swellTrend"></span></h3>
                <canvas id="waveChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Wave Direction</h3>
                <canvas id="waveDirectionChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Peak Period (s)</h3>
                <canvas id="peakPeriodChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Tide Height (m) <span id="tideTrend"></span></h3>
                <canvas id="tideChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let charts = {};

        // ── Alert thresholds ──
        const THRESHOLDS = {
            spur_speed:   { warning: 25, danger: 35 },
            clarke_speed: { warning: 25, danger: 35 },
            spur_gust:    { warning: 30, danger: 45 },
            clarke_gust:  { warning: 30, danger: 45 },
            wave_height:  { warning: 2.0, danger: 3.0 },
        };

        // ── Auto-refresh state ──
        const REFRESH_INTERVAL = 120; // seconds
        const STATUS_CHECK_INTERVAL = 300; // seconds
        let refreshCountdown = REFRESH_INTERVAL;
        let refreshTimer = null;
        let statusTimer = null;

        // ── Format timestamp for chart labels ──
        function formatTimeLabel(item) {
            // Prefer the scraped timestamp (always NZ local time)
            const raw = item.timestamp || item.recorded_at;
            if (!raw) return '';

            // If it's in "DD/MM/YYYY HH:MM" or similar scraped format, extract time
            const timeMatch = raw.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
            if (timeMatch) {
                return timeMatch[1].padStart(2, '0') + ':' + timeMatch[2];
            }

            // Fallback: try parsing as ISO date
            const d = new Date(raw);
            if (!isNaN(d.getTime())) {
                return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            }

            return '';
        }

        // ── Alert level for a value ──
        function getAlertLevel(field, value) {
            const t = THRESHOLDS[field];
            if (!t || value === null || value === undefined) return null;
            if (value >= t.danger) return 'danger';
            if (value >= t.warning) return 'warning';
            return null;
        }

        function buildDataItemHTML(label, value, unit, field) {
            const numVal = parseFloat(value);
            const alert = getAlertLevel(field, isNaN(numVal) ? null : numVal);
            const alertClass = alert ? ` ${alert}` : '';
            const badgeHTML = alert ? `<span class="alert-badge ${alert}">${alert}</span>` : '';
            const display = (value !== null && value !== undefined && value !== '') ? value : 'N/A';
            return `<div class="data-item${alertClass}">
                ${badgeHTML}
                <label>${label}</label>
                <value>${display}${unit}</value>
            </div>`;
        }

        // ── Compass helper ──
        function getCompassDirection(degrees) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
                               'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round(degrees / 22.5) % 16;
            return directions[index];
        }

        // ── Trend calculation ──
        function calculateTrend(data, field, hoursBack = 2) {
            if (data.length === 0) return 'stable';
            const current = data[data.length - 1][field];
            if (current === null || current === undefined) return 'stable';
            const pointsBack = (hoursBack * 60) / 2;
            const pastIndex = Math.max(0, data.length - 1 - pointsBack);
            const past = data[pastIndex][field];
            if (past === null || past === undefined) return 'stable';
            const threshold = Math.max(0.05, Math.abs(current * 0.05));
            if (current > past + threshold) return 'rising';
            if (current < past - threshold) return 'falling';
            return 'stable';
        }

        function updateTrendIndicator(elementId, trend) {
            const element = document.getElementById(elementId);
            if (!element) return;
            const labels = { rising: '▲ Rising', falling: '▼ Falling', stable: '● Stable' };
            element.textContent = labels[trend] || '';
            element.className = 'trend ' + trend;
        }

        // ── Manual fetch ──
        async function manualFetch() {
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('fetchBtn');

            btn.disabled = true;
            statusEl.textContent = 'Fetching...';
            statusEl.className = 'status-text';

            try {
                const response = await fetch('/api/fetch', { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    statusEl.textContent = 'Fetched successfully';
                    statusEl.className = 'status-text success';
                    await refreshDashboard();
                    resetCountdown();
                } else {
                    statusEl.textContent = 'Fetch failed';
                    statusEl.className = 'status-text error';
                }
            } catch (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.className = 'status-text error';
            } finally {
                btn.disabled = false;
            }
        }

        // ── Load latest data into current-conditions cards ──
        async function loadLatestData() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();

                if (data) {
                    const container = document.getElementById('currentData');
                    container.innerHTML =
                        buildDataItemHTML('Timestamp', data.timestamp, '', null) +
                        buildDataItemHTML('Buoy ID', data.buoy_id, '', null) +
                        buildDataItemHTML('Spur Wind Speed', data.spur_speed, ' kn', 'spur_speed') +
                        buildDataItemHTML('Spur Wind Direction', data.spur_direction != null ? data.spur_direction + '° ' + getCompassDirection(data.spur_direction) : null, '', null) +
                        buildDataItemHTML('Spur Max Gust', data.spur_gust, ' kn', 'spur_gust') +
                        buildDataItemHTML('Clarke Wind Speed', data.clarke_speed, ' kn', 'clarke_speed') +
                        buildDataItemHTML('Clarke Wind Direction', data.clarke_direction != null ? data.clarke_direction + '° ' + getCompassDirection(data.clarke_direction) : null, '', null) +
                        buildDataItemHTML('Clarke Max Gust', data.clarke_gust, ' kn', 'clarke_gust') +
                        buildDataItemHTML('Tide Height', data.tide_height, ' m', null) +
                        buildDataItemHTML('Wave Height', data.wave_height, ' m', 'wave_height') +
                        buildDataItemHTML('Wave Direction', data.wave_direction != null ? data.wave_direction + '° ' + getCompassDirection(data.wave_direction) : null, '', null) +
                        buildDataItemHTML('Peak Period', data.peak_period, ' s', null);

                    document.getElementById('lastUpdate').textContent = formatTimeLabel(data) || new Date().toLocaleTimeString();
                }
            } catch (error) {
                console.error('Error loading latest data:', error);
            }
        }

        // ── Load historical data and draw charts ──
        async function loadHistoricalData() {
            try {
                const response = await fetch('/api/data/averaged');
                const data = await response.json();
                if (data.length === 0) return;

                // Trends (use avg fields)
                updateTrendIndicator('tideTrend', calculateTrend(data, 'tide_height_avg', 2));
                updateTrendIndicator('swellTrend', calculateTrend(data, 'wave_height_avg', 2));

                const labels = data.map(d => formatTimeLabel(d));

                // Helper: build threshold annotations using avg data
                function avgThresholdData(fields) {
                    const fakeData = data.map(d => {
                        const obj = {};
                        fields.forEach(f => { obj[f] = d[f + '_avg']; });
                        return obj;
                    });
                    return fakeData;
                }

                updateChart('windSpeedChart', labels, [
                    { label: 'Spur', data: data.map(d => d.spur_speed_avg), color: '#00bcd4' },
                    { label: 'Spur (max)', data: data.map(d => d.spur_speed_max), color: '#00bcd4', envelope: true },
                    { label: 'Clarke', data: data.map(d => d.clarke_speed_avg), color: '#26c6da' },
                    { label: 'Clarke (max)', data: data.map(d => d.clarke_speed_max), color: '#26c6da', envelope: true }
                ], {
                    mode: 'auto-scale', buffer: 0.2,
                    annotations: buildThresholdAnnotations([
                        { value: 25, label: 'Warn', color: '#ffb74d' },
                        { value: 35, label: 'Danger', color: '#ef5350' }
                    ], avgThresholdData(['spur_speed', 'clarke_speed']), ['spur_speed', 'clarke_speed'])
                });

                updateChart('windDirectionChart', labels, [
                    { label: 'Spur', data: data.map(d => d.spur_direction_avg), color: '#00bcd4' },
                    { label: 'Clarke', data: data.map(d => d.clarke_direction_avg), color: '#26c6da' }
                ], { mode: 'direction' });

                updateChart('waveChart', labels, [
                    { label: 'Wave (m)', data: data.map(d => d.wave_height_avg), color: '#4caf50' },
                    { label: 'Wave (max)', data: data.map(d => d.wave_height_max), color: '#4caf50', envelope: true }
                ], {
                    mode: 'auto-scale', buffer: 0.2,
                    annotations: buildThresholdAnnotations([
                        { value: 2.0, label: 'Warn', color: '#ffb74d' },
                        { value: 3.0, label: 'Danger', color: '#ef5350' }
                    ], avgThresholdData(['wave_height']), ['wave_height'])
                });

                updateChart('waveDirectionChart', labels, [
                    { label: 'Wave Dir', data: data.map(d => d.wave_direction_avg), color: '#ff9800' }
                ], { mode: 'direction' });

                updateChart('peakPeriodChart', labels, [
                    { label: 'Period (s)', data: data.map(d => d.peak_period_avg), color: '#ce93d8' }
                ], { mode: 'auto-scale', buffer: 0.2 });

                updateChart('tideChart', labels, [
                    { label: 'Tide (m)', data: data.map(d => d.tide_height_avg), color: '#00bcd4' }
                ], { mode: 'fixed', yMin: 0, yMax: 3 });

            } catch (error) {
                console.error('Error loading historical data:', error);
            }
        }

        // ── Build annotation lines only if data is near threshold ──
        function buildThresholdAnnotations(levels, data, fields) {
            const allValues = [];
            fields.forEach(f => {
                data.forEach(d => {
                    if (d[f] !== null && d[f] !== undefined) allValues.push(d[f]);
                });
            });
            if (allValues.length === 0) return {};

            const maxVal = Math.max(...allValues);
            const annotations = {};

            levels.forEach((level, i) => {
                // Show line if max data value is within 30% of threshold
                if (maxVal >= level.value * 0.7) {
                    annotations['threshold' + i] = {
                        type: 'line',
                        yMin: level.value,
                        yMax: level.value,
                        borderColor: level.color,
                        borderWidth: 1.5,
                        borderDash: [6, 4],
                        label: {
                            display: true,
                            content: level.label + ' ' + level.value,
                            position: 'start',
                            backgroundColor: 'transparent',
                            color: level.color,
                            font: { size: 10 }
                        }
                    };
                }
            });

            return annotations;
        }

        // ── Chart theme colours ──
        const CHART_COLORS = {
            grid: 'rgba(0, 188, 212, 0.06)',
            tick: '#8899aa',
            legend: '#8899aa',
        };

        // ── Core chart update function ──
        function updateChart(canvasId, labels, datasets, config = {}) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            const { mode = 'fixed', yMin = null, yMax = null, buffer = 0.2, annotations = {} } = config;

            let yAxisConfig = {
                grid: { color: CHART_COLORS.grid },
                ticks: {
                    color: CHART_COLORS.tick,
                    callback: function(value) {
                        if (mode === 'direction') {
                            const compass = {0:'N', 45:'NE', 90:'E', 135:'SE', 180:'S', 225:'SW', 270:'W', 315:'NW', 360:'N'};
                            return compass[value] || value + '\u00B0';
                        }
                        return value.toFixed(1);
                    }
                }
            };

            if (mode === 'auto-scale') {
                let allValues = [];
                datasets.forEach(ds => {
                    allValues = allValues.concat(ds.data.filter(v => v !== null && v !== undefined));
                });
                if (allValues.length > 0) {
                    const dataMin = Math.min(...allValues);
                    const dataMax = Math.max(...allValues);
                    let range = dataMax - dataMin;
                    if (range === 0) range = Math.max(1, Math.abs(dataMin * 0.2));
                    yAxisConfig.min = Math.max(0, dataMin - (range * buffer));
                    yAxisConfig.max = dataMax + (range * buffer);
                    yAxisConfig.beginAtZero = dataMin - (range * buffer) <= 0;
                }
            } else if (mode === 'fixed' && yMin !== null && yMax !== null) {
                yAxisConfig.min = yMin;
                yAxisConfig.max = yMax;
                yAxisConfig.beginAtZero = yMin === 0;
            } else if (mode === 'direction') {
                yAxisConfig.min = 0;
                yAxisConfig.max = 360;
                yAxisConfig.beginAtZero = true;
                yAxisConfig.ticks.stepSize = 45;
            }

            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets.map(ds => {
                        if (ds.envelope) {
                            return {
                                label: ds.label,
                                data: ds.data,
                                borderColor: ds.color + '60',
                                backgroundColor: 'transparent',
                                tension: 0.3,
                                fill: false,
                                spanGaps: false,
                                pointRadius: 0,
                                borderWidth: 1,
                                borderDash: [2, 2]
                            };
                        }
                        return {
                            label: ds.label,
                            data: ds.data,
                            borderColor: ds.color,
                            backgroundColor: ds.color + '15',
                            tension: 0.3,
                            fill: true,
                            spanGaps: false,
                            pointRadius: 0,
                            borderWidth: 1.5
                        };
                    })
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: { duration: 400 },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: CHART_COLORS.legend }
                        },
                        title: { display: false },
                        annotation: {
                            annotations: annotations
                        }
                    },
                    scales: {
                        y: yAxisConfig,
                        x: {
                            grid: { color: CHART_COLORS.grid },
                            ticks: {
                                color: CHART_COLORS.tick,
                                maxTicksLimit: 12,
                                maxRotation: 0,
                                minRotation: 0
                            }
                        }
                    }
                }
            });
        }

        // ── Dashboard refresh (no page reload) ──
        async function refreshDashboard() {
            await Promise.all([loadLatestData(), loadHistoricalData()]);
        }

        // ── Auto-refresh countdown ──
        function resetCountdown() {
            refreshCountdown = REFRESH_INTERVAL;
        }

        function startAutoRefresh() {
            refreshTimer = setInterval(async () => {
                refreshCountdown--;
                const mins = Math.floor(refreshCountdown / 60);
                const secs = refreshCountdown % 60;
                document.getElementById('refreshCountdown').textContent =
                    'Auto-refresh ' + mins + ':' + secs.toString().padStart(2, '0');

                if (refreshCountdown <= 0) {
                    resetCountdown();
                    await refreshDashboard();
                }
            }, 1000);
        }

        // ── Health status check ──
        async function checkHealth() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                const dot = document.getElementById('healthDot');
                dot.className = 'pulse-dot';
                if (status.health === 'unhealthy') dot.classList.add('unhealthy');
                else if (status.health === 'degraded') dot.classList.add('degraded');
            } catch (e) {
                document.getElementById('healthDot').className = 'pulse-dot unhealthy';
            }
        }

        function startStatusCheck() {
            checkHealth();
            statusTimer = setInterval(checkHealth, STATUS_CHECK_INTERVAL * 1000);
        }

        // ── Init on page load ──
        window.addEventListener('load', async () => {
            await refreshDashboard();
            startAutoRefresh();
            startStatusCheck();
        });
    </script>
</body>
</html>
